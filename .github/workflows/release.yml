name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archives
        run: |
          git archive --format=tar.gz --prefix="haskell-production-lab-${GITHUB_REF_NAME}/" --output="haskell-production-lab-${GITHUB_REF_NAME}.tar.gz" HEAD
          git archive --format=zip --prefix="haskell-production-lab-${GITHUB_REF_NAME}/" --output="haskell-production-lab-${GITHUB_REF_NAME}.zip" HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "haskell-production-lab-${GITHUB_REF_NAME}.tar.gz" \
              "haskell-production-lab-${GITHUB_REF_NAME}.zip" \
              --clobber
            exit 0
          fi

          # Release notes are written per tag under docs/. This path used to be
          # hard-coded to v0.1.0, so every later tag would have published that
          # release's text as its own. Generated notes are the fallback: a
          # missing file should not stop the release, but it must not silently
          # ship another version's notes either.
          notes="docs/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            # The docs carry a language switcher whose links are relative to
            # docs/. Pasted into a release body they resolve under /releases/
            # and 404, so the switcher is stripped from the body rather than
            # from the file the docs site needs it in.
            sed '/i18n: language-switcher/,+1d' "$notes" >release-notes.md
            set -- --notes-file release-notes.md
          else
            echo "::warning::${notes} is missing; falling back to generated notes"
            set -- --generate-notes
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "haskell-production-lab-${GITHUB_REF_NAME}.tar.gz" \
            "haskell-production-lab-${GITHUB_REF_NAME}.zip" \
            --title "${GITHUB_REF_NAME}" \
            "$@"
